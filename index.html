<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="영어 말하기">
<title>한글 보고 영어로 말하기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
:root {
  --bg: #f3f2f8; --card: #ffffff; --ink: #24223a; --muted: #6b6886;
  --line: #dcd9ec; --accent: #5b55b8; --accent-soft: #e9e7f8;
  --good: #1f7a4d; --good-bg: #e3f4ea; --mid: #8a5a00; --mid-bg: #fbf0d9; --bad: #a33a3a; --bad-bg: #f8e3e3;
  --f-ko: "Gowun Batang", "Nanum Myeongjo", serif;
  --f-ui: "Noto Sans KR", system-ui, sans-serif;
  --f-en: "Literata", Georgia, serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #16151f; --card: #201f2d; --ink: #ecebf5; --muted: #a3a0bd;
  --line: #34324a; --accent: #a7a2f0; --accent-soft: #2c2a45;
  --good: #7fd6a5; --good-bg: #183326; --mid: #f0c56b; --mid-bg: #3a2e14; --bad: #f19a9a; --bad-bg: #3b1d1d;
  color-scheme: dark } }
* { box-sizing: border-box; }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-ui); font-size: 15px; line-height: 1.6; }
[hidden] { display: none !important; }
.wrap { max-width: 620px; margin: 0 auto; padding-block: 28px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 18px; }
header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--f-ko); font-size: 1.45rem; margin: 0; text-wrap: balance; }
.src { color: var(--muted); font-size: .82rem; }
.stats { display: flex; gap: 14px; font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .3s; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 26px 22px; display: grid; gap: 18px; min-width: 0; }
.label { font-size: .75rem; letter-spacing: .08em; color: var(--muted); }
.ko { font-family: var(--f-ko); font-size: 1.35rem; line-height: 1.7; margin: 4px 0 0; text-wrap: pretty; }
textarea { width: 100%; min-height: 92px; resize: vertical; font-family: var(--f-en); font-size: 1.05rem;
  padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
textarea:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tip { font-size: .82rem; color: var(--muted); margin: 6px 0 0; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
button { font-family: var(--f-ui); font-size: .95rem; border-radius: 10px; padding: 10px 18px; cursor: pointer; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--card); font-weight: 700; }
button.mic { border-color: var(--accent); color: var(--accent); font-weight: 700; }
button.mic.on { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
button:disabled { opacity: .5; cursor: default; }
.result { border-radius: 10px; padding: 14px 16px; display: grid; gap: 8px; }
.result.good { background: var(--good-bg); } .result.mid { background: var(--mid-bg); } .result.bad { background: var(--bad-bg); }
.verdict { font-weight: 700; }
.good .verdict { color: var(--good); } .mid .verdict { color: var(--mid); } .bad .verdict { color: var(--bad); }
.miss { font-family: var(--f-en); }
.miss span { background: var(--card); border-radius: 4px; padding: 0 4px; margin-right: 4px; }
.en { font-family: var(--f-en); font-size: 1.05rem; }
.answer { border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 10px; }
.pr { font-family: var(--f-ko); font-size: 1.15rem; line-height: 2.1; }
.pr rt { font-family: var(--f-ui); font-size: .7em; color: var(--accent); font-weight: 700; ruby-position: over; }
.legend { font-size: .78rem; color: var(--muted); }
.legend b { color: var(--accent); }
.small button { padding: 6px 14px; font-size: .88rem; }
.video { position: relative; width: 100%; max-width: 100%; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; background: #000; }
.video > * { position: absolute; inset: 0; width: 100%; height: 100%; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { padding: 6px 14px; border-radius: 999px; font-size: .88rem; }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 700; }
.tag { display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 8px; margin-right: 6px; letter-spacing: 0; }
.muted { color: var(--muted); font-size: .88rem; margin: 0; }
.wrap-inner { display: grid; gap: 18px; }
.filebtn { font-size: .85rem; color: var(--accent); border: 1px dashed var(--accent); border-radius: 10px; padding: 6px 14px; cursor: pointer; }
#empty:not([hidden]) ~ .row .filebtn { background: var(--accent); color: var(--card); border-style: solid; font-weight: 700; font-size: .95rem; padding: 10px 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>한글 보고 영어로 말하기</h1>
      <div class="src" id="src"></div>
    </div>
    <div class="stats"><span>맞힘 <b id="sGood">0</b></span><span>남은 문장 <b id="sLeft">0</b></span></div>
  </header>
  <section class="card" id="empty" hidden>
    <div>
      <div class="label">처음 한 번만 해 주세요</div>
      <p class="ko">연습할 문장 파일을 불러와 주세요.</p>
    </div>
    <p class="muted">Claude가 보내 준 <b>practice-data.json</b> 파일을 고르면 이 기기에만 저장돼요. 새 자료가 추가되면 새 파일을 다시 불러오면 돼요.</p>
  </section>
  <div class="row"><label class="filebtn" for="file">문장 파일 불러오기</label><input type="file" id="file" accept=".json,application/json" hidden></div>
  <p class="muted" id="fileMsg"></p>

  <div id="app" class="wrap-inner">
  <div class="chips" id="chips" role="group" aria-label="연습할 문장 고르기"></div>
  <div class="bar"><i id="bar"></i></div>

  <section class="card">
    <div>
      <div class="label"><span class="tag" id="tag"></span> 이 뜻을 영어로 말해 보세요</div>
      <p class="ko" id="ko"></p>
    </div>
    <div>
      <label class="label" for="said">내가 말한 영어</label>
      <textarea id="said" placeholder="Type or speak your English here"></textarea>
      <p class="tip" id="micTip">마이크 버튼을 누르고 영어로 말하면 글자로 바뀌고 바로 점검해요.</p>
    </div>
    <div class="row">
      <button class="mic" id="mic" type="button">마이크로 말하기</button>
      <button class="primary" id="check" type="button">확인하기</button>
      <button id="show" type="button">정답 보기</button>
      <button id="next" type="button">다음 문장</button>
    </div>
    <div class="result" id="result" hidden></div>
    <div class="answer" id="answer" hidden>
      <div class="label">정답 문장</div>
      <div class="en" id="en"></div>
      <div class="pr" id="pr"></div>
      <div class="legend"><b>°</b> f·v &nbsp; <b>ˇ</b> r &nbsp; <b>~</b> th</div>
      <div class="row small" id="listen">
        <button type="button" id="say">영어 듣기</button>
        <button type="button" id="saySlow">천천히 듣기</button>
        <button type="button" id="scene" hidden>장면 재생</button>
      </div>
      <div class="video" id="videoBox" hidden><div id="player"></div></div>
    </div>
  </section>
  </div>
</div>

<script>
// Sentences live only on this device: imported once from a file, then kept in localStorage
const KEY = "practice-sets";
let SETS = [];
try { SETS = JSON.parse(localStorage.getItem(KEY) || "[]"); } catch {}
const $ = id => document.getElementById(id);
$("file").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const sets = Array.isArray(data) ? data : data.sets;
    if (!Array.isArray(sets) || !sets.every(s => s.id && Array.isArray(s.sentences))) throw 0;
    localStorage.setItem(KEY, JSON.stringify(sets));
    location.reload();
  } catch { $("fileMsg").textContent = "이 파일은 읽을 수 없어요. Claude가 보내 준 practice-data.json 파일을 골라 주세요."; }
};
if (!SETS.length) { $("empty").hidden = false; $("app").hidden = true; }
let S = [], deck = [], cur = -1, good = 0;

// Each Caillou line plays until the next line with a later start time
SETS.forEach(set => {
  if (!set.video) return;
  set.sentences.forEach(s => {
    const later = set.sentences.map(x => x.t).filter(t => t > s.t);
    s.end = later.length ? Math.min(...later) : s.t + 8;
  });
});

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function stats() {
  $("sGood").textContent = good;
  $("sLeft").textContent = deck.length;
  $("bar").style.width = ((S.length - deck.length) / S.length * 100) + "%";
}
function load(id) {
  S = SETS.filter(x => id === "all" || x.id === id).flatMap(x => x.sentences.map(s => ({...s, set: x})));
  deck = []; good = 0;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c.dataset.id === id));
  $("src").textContent = (id === "all" ? SETS.map(x => x.source).join(" · ") : SETS.find(x => x.id === id).source) + " · " + S.length + "문장";
  try { localStorage.setItem("pick", id); } catch {}
  next();
}
function next() {
  if (!deck.length) { deck = shuffle(S.map((_, i) => i)); good = 0; }
  cur = deck.pop();
  const s = S[cur];
  $("ko").textContent = s.ko;
  $("en").textContent = s.en;
  renderPr($("pr"), s.pr);
  $("tag").textContent = s.set.name;
  $("scene").hidden = !s.set.video;
  $("videoBox").hidden = true;
  if (player && player.pauseVideo) player.pauseVideo();
  $("said").value = "";
  $("result").hidden = true;
  $("answer").hidden = true;
  stats();
}

// Checking: compare the words with the answer sentence
const norm = s => s.toLowerCase().replace(/[‘’]/g, "'").replace(/[^a-z0-9' ]+/g, " ").split(/\s+/).filter(Boolean);
const expand = w => w.flatMap(x => ({"i'm":["i","am"],"it's":["it","is"],"you're":["you","are"],"he's":["he","is"],"she's":["she","is"],"caillou's":["caillou","is"],"don't":["do","not"],"isn't":["is","not"],"let's":["let","us"],"what's":["what","is"],"that's":["that","is"],"i'll":["i","will"]})[x] || [x]);
function check() {
  const said = $("said").value.trim();
  if (!said) { $("said").focus(); return; }
  const target = expand(norm(S[cur].en)), have = new Set(expand(norm(said)));
  const missing = [...new Set(target.filter(x => !have.has(x)))];
  const hit = 1 - target.filter(x => !have.has(x)).length / target.length;
  const r = hit >= .9 ? {level: "good", verdict: "정답이에요!", text: "정답 문장과 거의 같아요."}
          : hit >= .6 ? {level: "mid", verdict: "거의 맞았어요", text: "빠진 단어를 확인해 보세요."}
          : {level: "bad", verdict: "다시 해 볼까요?", text: "정답 문장을 듣고 한 번 더 말해 보세요."};
  if (r.level === "good") good++;
  const box = $("result");
  box.className = "result " + r.level;
  box.replaceChildren();
  const v = document.createElement("div"); v.className = "verdict"; v.textContent = r.verdict;
  const t = document.createElement("div"); t.textContent = r.text;
  box.append(v, t);
  if (missing.length && r.level !== "good") {
    const m = document.createElement("div"); m.className = "miss";
    m.append("빠진 단어: ");
    missing.slice(0, 8).forEach(w => { const sp = document.createElement("span"); sp.textContent = w; m.append(sp); });
    box.append(m);
  }
  box.hidden = false;
  $("answer").hidden = false;
  stats();
}

// Microphone: browser speech recognition (Chrome, Edge, Safari)
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, listening = false;
if (SR) {
  rec = new SR();
  rec.lang = "en-US"; rec.interimResults = true; rec.maxAlternatives = 1;
  rec.onresult = e => {
    $("said").value = Array.from(e.results).map(r => r[0].transcript).join(" ");
    if (e.results[e.results.length - 1].isFinal) { stopMic(); check(); }
  };
  rec.onerror = e => {
    stopMic();
    if (e.error === "not-allowed" || e.error === "service-not-allowed") $("micTip").textContent = "마이크 사용이 막혀 있어요. 브라우저 설정에서 이 사이트의 마이크를 허용해 주세요.";
    else if (e.error === "no-speech") $("micTip").textContent = "소리가 안 들렸어요. 다시 눌러서 말해 보세요.";
  };
  rec.onend = stopMic;
  $("mic").onclick = () => {
    if (listening) { rec.stop(); return; }
    try { rec.start(); listening = true; $("mic").classList.add("on"); $("mic").textContent = "듣는 중... (누르면 멈춤)"; } catch {}
  };
} else {
  $("mic").hidden = true;
  $("micTip").textContent = "이 브라우저는 마이크 인식을 지원하지 않아요. 키보드의 마이크 버튼으로 말하거나 직접 입력해 주세요.";
}
function stopMic() { listening = false; $("mic").classList.remove("on"); $("mic").textContent = "마이크로 말하기"; }

// Korean pronunciation with the book's marks: ° f/v, ˇ r, ~ th
const MARK = {r: "ˇ", f: "°", v: "°", th: "~"};
function renderPr(el, s) {
  el.replaceChildren();
  el.hidden = !s;
  if (!s) return;
  let i = 0;
  for (const m of s.matchAll(/\[(th|r|f|v)([^\]]+)\]/g)) {
    el.append(s.slice(i, m.index));
    const rb = document.createElement("ruby"), rt = document.createElement("rt");
    rt.textContent = MARK[m[1]];
    rb.append(m[2], rt);
    el.append(rb);
    i = m.index + m[0].length;
  }
  el.append(s.slice(i));
}

// Listening: device voice
const tts = window.speechSynthesis;
let voice = null;
function pickVoice() {
  const vs = tts.getVoices().filter(v => /^en[-_]/i.test(v.lang));
  voice = vs.find(v => /en[-_]US/i.test(v.lang)) || vs[0] || null;
}
function speak(rate) {
  tts.cancel();
  const u = new SpeechSynthesisUtterance(S[cur].en.replace(/[“”"]/g, ""));
  u.lang = "en-US"; u.rate = rate;
  if (voice) u.voice = voice;
  tts.speak(u);
}
if (tts && window.SpeechSynthesisUtterance) {
  pickVoice();
  tts.addEventListener("voiceschanged", pickVoice);
  $("say").onclick = () => speak(1);
  $("saySlow").onclick = () => speak(0.7);
} else {
  $("say").hidden = $("saySlow").hidden = true;
}

// Scene: YouTube player that plays only this line
let player = null, ytReady = false, pending = null;
window.onYouTubeIframeAPIReady = () => {
  player = new YT.Player("player", {
    playerVars: {playsinline: 1, rel: 0, cc_load_policy: 1},
    events: {onReady: () => { ytReady = true; if (pending) { playScene(pending); pending = null; } }}
  });
};
function playScene(s) {
  player.loadVideoById({videoId: s.set.video, startSeconds: s.t, endSeconds: s.end});
}
$("scene").onclick = () => {
  const s = S[cur];
  $("videoBox").hidden = false;
  if (!window.YT) {
    const tag = document.createElement("script");
    tag.src = "https://www.youtube.com/iframe_api";
    document.head.append(tag);
  }
  if (ytReady) playScene(s); else pending = s;
};

$("check").onclick = check;
$("show").onclick = () => { $("answer").hidden = false; };
$("next").onclick = next;
$("said").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); check(); } });
[{id: "all", name: "전체"}, ...SETS].forEach(x => {
  const b = document.createElement("button");
  b.className = "chip"; b.dataset.id = x.id; b.textContent = x.name; b.type = "button";
  b.onclick = () => load(x.id);
  $("chips").append(b);
});
let saved = "all";
try { saved = localStorage.getItem("pick") || "all"; } catch {}
if (SETS.length) load(["all", ...SETS.map(x => x.id)].includes(saved) ? saved : "all");
</script>
</body>
</html>
